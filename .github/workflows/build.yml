name: Build FrameFlux

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # === АВТО-СКАЧКА GRADLE 9.2.1 ===
      - name: Download Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> $GITHUB_PATH
          gradle --version

      # === СБОРКА ===
      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # === КОРОТКАЯ ВЫЖИМКА ОШИБОК ===
      - name: Summarize errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "## ❌ Сборка упала" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔎 Суть ошибки" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|error;|Caused by:|FAILURE:|What went wrong|Execution failed|Could not" build.log \
            | grep -viE "warning:|deprecat|^\s*at " \
            | sort -u \
            | head -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # === ЗАГРУЗКА ЛОГА ПРИ ПАДЕНИИ ===
      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # === ЗАГРУЗКА JAR ПРИ УСПЕХЕ ===
      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FrameFlux-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          retention-days: 30

      # === ПРОВАЛ, ЕСЛИ СБОРКА УПАЛА ===
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
