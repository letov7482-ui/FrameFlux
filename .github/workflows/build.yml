name: Build FrameFlux

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Gradle 9.2.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
          unzip -q gradle-9.2.1-bin.zip
          echo "$PWD/gradle-9.2.1/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      # === ДИАГНОСТИКА: где реально лежит jar ===
      - name: Find jar everywhere
        if: always()
        run: |
          echo "=== ВСЁ, ЧТО ПОХОЖЕ НА JAR ==="
          find . -name "*.jar" \
            -not -path "./gradle-9.2.1/*" \
            -not -path "./.gradle/*" \
            -not -path "./gradle/*" \
            -not -path "*/.git/*" || echo "НИЧЕГО НЕ НАЙДЕНО"
          echo ""
          echo "=== ВСЯ СТРУКТУРА build/ ==="
          find build -type f 2>/dev/null | head -50 || echo "build/ ПУСТОЙ"
          echo ""
          echo "=== ЕСТЬ ЛИ ПАПКА build/ ==="
          ls -la build/ 2>/dev/null || echo "build/ НЕ СУЩЕСТВУЕТ"
          echo ""
          echo "=== ЕСТЬ ЛИ ПАПКА build/libs/ ==="
          ls -la build/libs/ 2>/dev/null || echo "build/libs/ НЕ СУЩЕСТВУЕТ"
          echo ""
          echo "=== ЕСТЬ ЛИ ПАПКА build/devlibs/ ==="
          ls -la build/devlibs/ 2>/dev/null || echo "build/devlibs/ НЕ СУЩЕСТВУЕТ"
          echo ""
          echo "=== ПОСЛЕДНИЕ 40 СТРОК build.log ==="
          tail -n 40 build.log 2>/dev/null || echo "build.log НЕ СОЗДАН"
          echo ""
          echo "=== ЕСТЬ ЛИ TASK :remapJar В ЛОГЕ ==="
          grep -n "remapJar" build.log 2>/dev/null || echo "TASK :remapJar НЕ НАЙДЕН В ЛОГЕ"

      - name: Summarize errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "## ❌ Сборка упала" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔎 Суть ошибки" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|error;|Caused by:|FAILURE:|What went wrong|Execution failed|Could not" build.log \
            | grep -viE "warning:|deprecat|^\s*at " \
            | sort -u \
            | head -n 25 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      # === ЗАГРУЗКА JAR (берём весь build/ на всякий случай) ===
      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrameFlux-jar
          path: |
            build/libs/
            build/devlibs/
            build/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
